# instances.yaml — inventaire des formules CNF a benchmarker.
#
# Chaque entree decrit une instance avec son chemin (relatif a src/), sa famille,
# ses parametres, sa borne psw theorique attendue et la severite associee.
#
# Champs :
#   id                       identifiant unique snake_case (sert de cle CSV)
#   path                     chemin DIMACS relatif au cwd ``src/``
#   family                   type1 | type2 | type3 | random | tseytin |
#                            factorization | misc
#   n_vars, n_clauses        renseignes si connus, sinon lus dans le DIMACS
#   params                   parametres famille-specifiques (informatif)
#   expected_psw_max         borne psw theorique attendue (null si pas de borne)
#   expected_psw_severity    hard | soft | none
#   timeout_s                override du timeout pour cette instance
#   enabled                  defaut true ; mettre false pour skipper
#   notes                    commentaire libre
#
# Tous les chemins commencent par "../data/" car l'orchestrateur lance sat_solver
# depuis src/. Les bornes psw sont issues des papiers Saether/Telle/Vatshelle 2015
# (Section 6.1) pour les types 1-3, et calibrees empiriquement pour t=5 s=3.

