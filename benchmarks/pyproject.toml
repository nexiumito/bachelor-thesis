[project]
name = "bachelor-thesis-benchmarks"
version = "0.1.0"
description = "Harness de benchmark pour le solveur DP/MaxSAT/sharpSAT (these L3 UNIGE)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Elie Bussod" }]
license = { text = "see repo LICENSE" }

dependencies = [
    "z3-solver>=4.12",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "jinja2>=3.1",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Pas de package Python a installer ; pyproject sert a `pip install -e benchmarks`
# uniquement pour resoudre les dependances. Les modules sont executes en place.
py-modules = []
